# ==============================================================================
# Zapret2 Runtime Configuration (live-editable in dotfiles/zapret/zapret2.conf)
# ==============================================================================
# Applied automatically via: sudo systemctl restart nfqws2@default
# Hostlists can be reloaded without connection drop via: sudo systemctl reload nfqws2@default
# ==============================================================================

--qnum=200
--fwmark=0x40000000

# Lua Desync Engine Initialization
--lua-init=@/var/lib/zapret2/lua/zapret-lib.lua
--lua-init=@/var/lib/zapret2/lua/zapret-antidpi.lua

# ------------------------------------------------------------------------------
# Profile 1: Plain HTTP (Port 80)
# ------------------------------------------------------------------------------
--name=http
--filter-tcp=80
--payload=http_req
--hostlist-exclude=/var/lib/zapret2/lists/list-exclude.txt
--hostlist-exclude=/var/lib/zapret2/lists/private-exclude.txt
--lua-desync=http_methodeol
--hostlist-auto=/var/lib/zapret2/http-hosts.txt

# ------------------------------------------------------------------------------
# Profile 2: Soft HTTPS Desync (Pure multisplit without fake packets)
# Needed for servers that reset connections on fake packets (AWS CloudFront, Atoma Cloud, Darktide)
# ------------------------------------------------------------------------------
--new
--name=https-nofake
--filter-tcp=443,8443,2053,2083,2087,2096
--payload=tls_client_hello
--hostlist=/var/lib/zapret2/lists/list-nofake.txt
--hostlist-exclude=/var/lib/zapret2/lists/list-exclude.txt
--hostlist-exclude=/var/lib/zapret2/lists/private-exclude.txt
--lua-desync=multisplit:pos=1,midsld

# ------------------------------------------------------------------------------
# Profile 3: Critical HTTPS (YouTube, Discord, etc. using fake TLS desync)
# ------------------------------------------------------------------------------
--new
--name=https-critical
--filter-tcp=443,8443,2053,2083,2087,2096
--payload=tls_client_hello
--hostlist=/var/lib/zapret2/lists/list-general.txt
--hostlist=/var/lib/zapret2/lists/list-google.txt
--hostlist=/var/lib/zapret2/lists/private-include.txt
--hostlist-exclude=/var/lib/zapret2/lists/list-exclude.txt
--hostlist-exclude=/var/lib/zapret2/lists/private-exclude.txt
--lua-desync=fake:blob=fake_default_tls:tcp_ts=-1000:repeats=1
--lua-desync=fakedsplit:pos=1,midsld:tcp_ts=-1000

# ------------------------------------------------------------------------------
# Profile 4: General HTTPS with auto-detection for newly blocked hosts
# ------------------------------------------------------------------------------
--new
--name=https-general
--filter-tcp=443,8443,2053,2083,2087,2096
--payload=tls_client_hello
--hostlist-exclude=/var/lib/zapret2/lists/list-exclude.txt
--hostlist-exclude=/var/lib/zapret2/lists/private-exclude.txt
--lua-desync=fake:blob=fake_default_tls:tcp_ts=-1000:repeats=1
--lua-desync=fakedsplit:pos=1,midsld:tcp_ts=-1000
--hostlist-auto=/var/lib/zapret2/https-general-hosts.txt

# ------------------------------------------------------------------------------
# Profile 5: Discord Voice / STUN
# ------------------------------------------------------------------------------
--new
--name=discord-voice
--filter-udp=19294-19344,50000-65535
--payload=stun,discord_ip_discovery
--lua-desync=fake:blob=0x00000000000000000000000000000000:repeats=6

# ------------------------------------------------------------------------------
# Profile 6: QUIC (UDP 443)
# ------------------------------------------------------------------------------
--new
--name=quic
--filter-udp=443
--payload=quic_initial
--hostlist=/var/lib/zapret2/lists/list-google.txt
--lua-desync=fake:blob=fake_default_quic:repeats=2
