# nvfetcher configuration for nixos-conf
# Documentation: https://github.com/berberman/nvfetcher

[t3code]
src.github = "pingdotgg/t3code"
src.prefix = "v"
fetch.url = "https://github.com/pingdotgg/t3code/releases/download/v$ver/T3-Code-$ver-x86_64.AppImage"

[t3-cli]
src.github = "pingdotgg/t3code"
src.prefix = "v"
fetch.url = "https://github.com/pingdotgg/t3code/releases/download/v$ver/t3-$ver-linux-x64.tar.gz"

[flclash]
src.github = "chen08209/FlClash"
src.prefix = "v"
fetch.url = "https://github.com/chen08209/FlClash/releases/download/v$ver/FlClash-$ver-linux-amd64.deb"

[happ-desktop]
src.github = "Happ-proxy/happ-desktop"
fetch.url = "https://github.com/Happ-proxy/happ-desktop/releases/download/$ver/Happ.linux.x64.deb"

[amethyst-mod-manager]
src.github = "ChrisDKN/Amethyst-Mod-Manager"
src.prefix = "v"
fetch.url = "https://github.com/ChrisDKN/Amethyst-Mod-Manager/releases/download/v$ver/AmethystModManager-$ver-x86_64.AppImage"

[wfhelper]
src.github = "WFHelper/WFHelper"
src.prefix = "v"
fetch.url = "https://github.com/WFHelper/WFHelper/releases/download/v$ver/WFHelper-$ver.AppImage"

[omp]
src.github = "can1357/oh-my-pi"
src.prefix = "v"
fetch.url = "https://github.com/can1357/oh-my-pi/releases/download/v$ver/omp-linux-x64"

[artcraft-launcher]
src.github = "storytold/craft-launcher"
src.prefix = "v"
fetch.url = "https://github.com/storytold/craft-launcher/releases/download/v$ver/artcraft-launcher-$ver-linux-x86_64.AppImage"

[brave]
src.webpage = "https://versions.brave.com/latest/release-linux-x64.version"
src.regex = "([0-9.]+)"
fetch.url = "https://github.com/brave/brave-browser/releases/download/v$ver/brave-browser_$ver_amd64.deb"

[brave-origin]
src.webpage = "https://versions.brave.com/latest/origin-release-linux-x64.version"
src.regex = "([0-9.]+)"
fetch.url = "https://github.com/brave/brave-browser/releases/download/v$ver/brave-origin_$ver_amd64.deb"

[pi-coding-agent]
src.github = "earendil-works/pi"
src.prefix = "v"
fetch.url = "https://github.com/earendil-works/pi/releases/download/v$ver/pi-linux-x64.tar.gz"

[creabim]
src.webpage = "https://api.github.com/repos/chopinregis/CreaBIM/releases/latest"
src.regex = 'https://github\.com/chopinregis/CreaBIM/releases/download/(v[0-9.]+/CreaBIM-[^"]+-linux-x64\.tar\.gz)'
fetch.url = "https://github.com/chopinregis/CreaBIM/releases/download/$ver"
